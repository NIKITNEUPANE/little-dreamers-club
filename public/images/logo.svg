<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Defs for gradients and filters -->
  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8B3"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F78A8"/>
      <stop offset="100%" stop-color="#5B4673"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE8F5"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brand Emblem Graphic (Left) -->
  <g transform="translate(8, 6)">
    <!-- Soft Glow circle behind -->
    <circle cx="34" cy="34" r="32" fill="#F6F2FA" opacity="0.9"/>
    
    <!-- Golden Crescent Moon -->
    <path d="M40 12 C28 12 18 22 18 34 C18 46 28 56 40 56 C34 52 30 44 30 34 C30 24 34 16 40 12 Z" 
          fill="url(#moonGrad)" filter="url(#softGlow)"/>

    <!-- Dreamy Clouds -->
    <path d="M12 48 C12 43 16 39 21 39 C23 35 27 32 32 32 C37 32 41 35 43 39 C46 39 50 42 50 46 C50 50 46 54 41 54 L17 54 C14 54 12 51 12 48 Z" 
          fill="url(#cloudGrad)" opacity="0.95"/>
    
    <!-- Sleeping Child Silhouette / Cap -->
    <!-- Head -->
    <circle cx="29" cy="30" r="6" fill="#FCECE5"/>
    <!-- Sleeping Eye curve -->
    <path d="M27 31 Q29 33 31 31" stroke="#5B4673" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheek -->
    <circle cx="28" cy="32.5" r="1.2" fill="#F2A4B2" opacity="0.7"/>
    <!-- Nightcap in lavender with gold pompom -->
    <path d="M24 28 C25 22 33 21 34 27 C34 27 36 21 40 20 C42 19.5 43 21 42 23 C39 27 35 29 35 29 Z" fill="#7E6A94"/>
    <circle cx="42" cy="20" r="2" fill="#D4AF37"/>

    <!-- Gold Twinkle Stars -->
    <!-- Star 1 -->
    <path d="M48 18 L49 21 L52 22 L49 23 L48 26 L47 23 L44 22 L47 21 Z" fill="#D4AF37"/>
    <!-- Star 2 -->
    <path d="M15 22 L15.6 23.8 L17.5 24.5 L15.6 25.2 L15 27 L14.4 25.2 L12.5 24.5 L14.4 23.8 Z" fill="#D4AF37"/>
    <!-- Tiny star 3 -->
    <circle cx="36" cy="14" r="1" fill="#D4AF37"/>
    <circle cx="52" cy="32" r="1.2" fill="#D4AF37"/>
  </g>

  <!-- Typography (Center-Right) -->
  <g transform="translate(82, 0)">
    <!-- Primary Title -->
    <text x="0" y="38" 
          font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" 
          font-size="21" 
          font-weight="600" 
          letter-spacing="2.5" 
          fill="#3B2D4A">
      LITTLE DREAMERS
    </text>
    
    <!-- Subtitle CLUB -->
    <text x="1.5" y="55" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="9" 
          font-weight="600" 
          letter-spacing="5" 
          fill="#84709B">
      CLUB
    </text>

    <!-- Star ornament & baseline label -->
    <g transform="translate(78, 51)">
      <circle cx="0" cy="0" r="1.5" fill="#D4AF37"/>
      <line x1="8" y1="0" x2="35" y2="0" stroke="#D8CEE3" stroke-width="1"/>
      <text x="42" y="3" 
            font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
            font-size="7.5" 
            font-weight="500" 
            letter-spacing="2" 
            fill="#A396B5">
        EST. 2026
      </text>
    </g>
  </g>
</svg>
